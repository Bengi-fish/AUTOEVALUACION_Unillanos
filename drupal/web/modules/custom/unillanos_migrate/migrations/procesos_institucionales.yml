id: procesos_institucionales
label: 'Procesos institucionales (con sede, sin programa)'
migration_group: unillanos
# Procesos de la Universidad por sede. No llevan modelo (lineamiento) mientras
# Acreditación no confirme cuál usó cada uno.
source:
  plugin: csv
  path: '%datos%/semillas/procesos_institucionales.csv'
  ids: [id]
process:
  title: nombre
  field_tipo_proceso: tipo_proceso
  field_ambito:
    plugin: default_value
    default_value: institucional
  field_sede:
    plugin: migration_lookup
    migration: sedes
    source: sede_id
    no_stub: true
  field_periodo_evaluado: periodo
  field_estado: estado
  status:
    plugin: default_value
    default_value: 1
destination:
  plugin: 'entity:node'
  default_bundle: proceso
migration_dependencies:
  required:
    - sedes

id: archivos
label: 'Archivos de los documentos del programa'
migration_group: unillanos
unillanos_por_programa: true
# Un programa sin documentos.csv no tiene esta migración.
unillanos_csv_opcional: true
source:
  plugin: csv
  path: '%datos%/importacion/%carpeta%/documentos.csv'
  ids: [id]
  constants:
    destino: 'public://documentos/%programa%'
process:
  # Un documento con enlace externo (columna `enlace`) no tiene archivo: la
  # fila se omite aquí y el medio se crea solo con el enlace.
  ruta:
    -
      plugin: skip_on_empty
      method: row
      source: archivo
    -
      plugin: unillanos_ruta_archivo
      source: archivo
      raiz: '%raiz%'
      bases: [docs, datos]
  filename:
    plugin: callback
    callable: basename
    source: archivo
  destino:
    plugin: concat
    source:
      - constants/destino
      - '@filename'
    delimiter: /
  uri:
    plugin: file_copy
    source:
      - '@ruta'
      - '@destino'
  status:
    plugin: default_value
    default_value: 1
destination:
  plugin: 'entity:file'

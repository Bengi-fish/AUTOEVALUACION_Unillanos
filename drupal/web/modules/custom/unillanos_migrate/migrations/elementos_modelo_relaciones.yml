id: elementos_modelo_relaciones
label: 'Elementos del modelo (padre)'
migration_group: unillanos
source:
  plugin: csv
  path: '%datos%/semillas/elementos_modelo.csv'
  ids: [id]
process:
  tid:
    plugin: migration_lookup
    migration: elementos_modelo
    source: id
    no_stub: true
  parent:
    -
      plugin: skip_on_empty
      method: process
      source: padre_id
    -
      plugin: migration_lookup
      migration: elementos_modelo
      no_stub: true
destination:
  plugin: 'entity:taxonomy_term'
  default_bundle: elemento_modelo
  overwrite_properties:
    - parent
migration_dependencies:
  required:
    - elementos_modelo

# Portal de Autoevaluación y Acreditación: es la página de inicio del sitio
# (system.site:page.front). Su ruta interna es /portal; se entra por «/».
unillanos_autoeval.portal:
  path: '/portal'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\PortalController::portal'
    _title: 'Autoevaluación y Acreditación'
  requirements:
    _permission: 'access content'

# SIAAI: la portada del sistema de información de autoevaluación (antes /inicio).
unillanos_autoeval.portada:
  path: '/siaai'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\PortadaController::portada'
    _title: 'Sistema de Información de Autoevaluación Institucional'
  requirements:
    _permission: 'access content'

# Direcciones anteriores que siguen funcionando: redirigen (301) a la página o
# a la sección que hoy las contiene.
unillanos_autoeval.inicio_anterior:
  path: '/inicio'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\RedireccionController::redirigir'
    _ruta: 'unillanos_autoeval.portada'
  requirements:
    _access: 'TRUE'

unillanos_autoeval.documentos:
  path: '/documentos'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\DocumentosController::documentos'
    _title: 'Documentos'
  requirements:
    _permission: 'access content'

unillanos_autoeval.programas:
  path: '/programas'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\ProgramasController::programas'
    _title: 'Programas'
  requirements:
    _permission: 'access content'

# Entrada propia al inicio de sesión de Acreditación. No se enlaza desde el
# sitio público; /user/login sigue como respaldo del administrador.
unillanos_autoeval.acceso:
  path: '/acceso-acreditacion'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\AccesoController::acceso'
    _title: 'Acceso'
  requirements:
    _access: 'TRUE'

unillanos_autoeval.micrositio:
  path: '/admin/config/unillanos/micrositio'
  defaults:
    _form: '\Drupal\unillanos_autoeval\Form\MicrositioForm'
    _title: 'Micrositio de autoevaluación'
  requirements:
    _permission: 'edit unillanos micrositio'

unillanos_autoeval.acreditacion:
  path: '/admin/acreditacion'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\AcreditacionController::panel'
    _title: 'Acreditación'
  requirements:
    _permission: 'access acreditacion panel'

# Formularios simples de Acreditación. El acceso es el de editar o crear.
unillanos_autoeval.acreditacion_ficha:
  path: '/admin/acreditacion/programa/{node}/ficha'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\AcreditacionFormulariosController::ficha'
    _title: 'Ficha del programa'
  requirements:
    _entity_access: 'node.update'
    node: '\d+'
  options:
    parameters:
      node:
        type: 'entity:node'

# Foto de la cabecera del programa: form mode `foto` con solo la imagen.
unillanos_autoeval.acreditacion_foto:
  path: '/admin/acreditacion/programa/{node}/foto'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\AcreditacionFormulariosController::foto'
    _title: 'Foto del programa'
  requirements:
    _entity_access: 'node.update'
    node: '\d+'
  options:
    parameters:
      node:
        type: 'entity:node'

unillanos_autoeval.acreditacion_documento:
  path: '/admin/acreditacion/documento/{media}/editar'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\AcreditacionFormulariosController::documento'
    _title: 'Documento'
  requirements:
    _entity_access: 'media.update'
    media: '\d+'
  options:
    parameters:
      media:
        type: 'entity:media'

unillanos_autoeval.acreditacion_documento_nuevo:
  path: '/admin/acreditacion/documento/nuevo'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\AcreditacionFormulariosController::documentoNuevo'
    _title: 'Subir un documento'
  requirements:
    _entity_create_access: 'media:documento'

# «Institucional»: portada y sus cinco módulos (Fase 9, etapa 3).
unillanos_autoeval.institucional:
  path: '/institucional'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\InstitucionalController::portada'
    _title: 'Institucional'
  requirements:
    _permission: 'access content'

unillanos_autoeval.institucional_procesos:
  path: '/institucional/procesos'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\RedireccionController::redirigir'
    _ruta: 'unillanos_autoeval.institucional'
    _ancla: 'procesos'
  requirements:
    _access: 'TRUE'

unillanos_autoeval.institucional_dependencias:
  path: '/institucional/dependencias'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\RedireccionController::redirigir'
    _ruta: 'unillanos_autoeval.institucional'
    _ancla: 'dependencias'
  requirements:
    _access: 'TRUE'

unillanos_autoeval.institucional_directivos:
  path: '/institucional/directivos'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\RedireccionController::redirigir'
    _ruta: 'unillanos_autoeval.institucional'
    _ancla: 'directivos'
  requirements:
    _access: 'TRUE'

unillanos_autoeval.institucional_normatividad:
  path: '/institucional/normatividad'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\RedireccionController::redirigir'
    _ruta: 'unillanos_autoeval.institucional'
    _ancla: 'normatividad'
  requirements:
    _access: 'TRUE'

unillanos_autoeval.institucional_cifras:
  path: '/institucional/cifras'
  defaults:
    _controller: '\Drupal\unillanos_autoeval\Controller\RedireccionController::redirigir'
    _ruta: 'unillanos_autoeval.institucional'
    _ancla: 'cifras'
  requirements:
    _access: 'TRUE'

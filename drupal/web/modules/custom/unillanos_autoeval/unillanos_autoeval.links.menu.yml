# Menús de la demostración: solo páginas que existen. «Inicio» lo aporta el
# perfil standard (standard.front_page). Los enlaces apuntan a la ruta y no a
# una URL escrita, así que solo existen si la ruta existe.
# «Institucional» y «Participa» se añaden cuando existan sus rutas (Participa,
# Fase 8): no se deja ningún enlace a una página que no existe.
unillanos_autoeval.menu.programas:
  title: 'Programas'
  route_name: unillanos_autoeval.programas
  menu_name: main
  weight: 1
unillanos_autoeval.menu.documentos:
  title: 'Documentos'
  route_name: unillanos_autoeval.documentos
  menu_name: main
  weight: 2

# Menú del pie: la columna «Explora» (se omite si no hay enlaces).
unillanos_autoeval.pie.programas:
  title: 'Programas'
  route_name: unillanos_autoeval.programas
  menu_name: footer
  weight: 1
unillanos_autoeval.pie.documentos:
  title: 'Documentos'
  route_name: unillanos_autoeval.documentos
  menu_name: footer
  weight: 2

# Administración: configuración del micrositio (cabecera, franja superior y pie).
unillanos_autoeval.admin.micrositio:
  title: 'Micrositio de autoevaluación'
  description: 'Nombre, franja superior y pie de página del micrositio.'
  route_name: unillanos_autoeval.micrositio
  parent: system.admin_config_system
  weight: 10

# Panel de Acreditación: hijo directo de «Administración» (system.admin), al
# lado de Estructura, Configuración, Personas... No cuelga de «Configuración»
# (el rol no accede a /admin/config) ni de «Contenido»: el módulo Navigation del
# núcleo quita system.admin_content de su árbol y lo que cuelga de ahí quedaría
# oculto en la barra lateral. Navigation pinta la sección «Administración»
# desde el segundo nivel (level 2), así que este enlace se ve con solo el permiso
# del panel, sin «access administration pages».
unillanos_autoeval.admin.acreditacion:
  title: 'Acreditación'
  description: 'Programas de autoevaluación y accesos para editar su contenido.'
  route_name: unillanos_autoeval.acreditacion
  parent: system.admin
  weight: -9

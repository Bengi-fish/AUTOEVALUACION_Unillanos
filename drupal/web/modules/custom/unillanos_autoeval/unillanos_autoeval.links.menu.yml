# Menús de la demostración: solo páginas que existen. «Inicio» lo aporta el
# perfil standard (standard.front_page). Los enlaces apuntan a la ruta y no a
# una URL escrita, así que solo existen si la ruta existe.
# «Participa» se añade cuando exista su ruta (Fase 8): no se deja ningún
# enlace a una página que no existe. «Institucional» (Fase 9) lleva sus cinco
# módulos como hijos; el menú los pinta como un desplegable accesible.

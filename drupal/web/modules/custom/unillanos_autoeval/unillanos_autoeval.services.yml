services:
  unillanos_autoeval.calculador_grado:
    class: Drupal\unillanos_autoeval\Service\CalculadorGrado
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\CalculadorGrado: '@unillanos_autoeval.calculador_grado'

  unillanos_autoeval.avance_meta:
    class: Drupal\unillanos_autoeval\Service\AvanceMeta
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\AvanceMeta: '@unillanos_autoeval.avance_meta'

  unillanos_autoeval.sugerencia_destino:
    class: Drupal\unillanos_autoeval\Service\SugerenciaDestino
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\SugerenciaDestino: '@unillanos_autoeval.sugerencia_destino'

  unillanos_autoeval.modelo_proceso:
    class: Drupal\unillanos_autoeval\Service\ModeloProceso
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\ModeloProceso: '@unillanos_autoeval.modelo_proceso'

  unillanos_autoeval.listado_programas:
    class: Drupal\unillanos_autoeval\Service\ListadoProgramas
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\ListadoProgramas: '@unillanos_autoeval.listado_programas'

  unillanos_autoeval.documentos_publicados:
    class: Drupal\unillanos_autoeval\Service\DocumentosPublicados
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\DocumentosPublicados: '@unillanos_autoeval.documentos_publicados'

  unillanos_autoeval.programas_y_procesos:
    class: Drupal\unillanos_autoeval\Service\ProgramasYProcesos
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\ProgramasYProcesos: '@unillanos_autoeval.programas_y_procesos'

  unillanos_autoeval.factores_programa:
    class: Drupal\unillanos_autoeval\Service\FactoresPrograma
    arguments: ['@entity_type.manager', '@unillanos_autoeval.programas_y_procesos']
  Drupal\unillanos_autoeval\Service\FactoresPrograma: '@unillanos_autoeval.factores_programa'

  unillanos_autoeval.plan_mejoramiento_programa:
    class: Drupal\unillanos_autoeval\Service\PlanMejoramientoPrograma
    arguments: ['@entity_type.manager', '@unillanos_autoeval.programas_y_procesos']
  Drupal\unillanos_autoeval\Service\PlanMejoramientoPrograma: '@unillanos_autoeval.plan_mejoramiento_programa'

  unillanos_autoeval.datos_portada:
    class: Drupal\unillanos_autoeval\Service\DatosPortada
    arguments: ['@entity_type.manager', '@unillanos_autoeval.listado_programas', '@unillanos_autoeval.factores_programa', '@url_generator', '@access_manager', '@current_user']
  Drupal\unillanos_autoeval\Service\DatosPortada: '@unillanos_autoeval.datos_portada'

  unillanos_autoeval.pagina_programa:
    class: Drupal\unillanos_autoeval\Service\PaginaPrograma
    arguments: ['@unillanos_autoeval.listado_programas', '@url_generator', '@access_manager', '@current_user', '@entity_type.manager', '@file_url_generator']
  Drupal\unillanos_autoeval\Service\PaginaPrograma: '@unillanos_autoeval.pagina_programa'

  unillanos_autoeval.enlaces_del_pie:
    class: Drupal\unillanos_autoeval\Service\EnlacesDelPie
    arguments: ['@menu.link_tree']
  Drupal\unillanos_autoeval\Service\EnlacesDelPie: '@unillanos_autoeval.enlaces_del_pie'

  unillanos_autoeval.datos_marco:
    class: Drupal\unillanos_autoeval\Service\DatosMarco
    arguments: ['@config.factory', '@datetime.time']
  Drupal\unillanos_autoeval\Service\DatosMarco: '@unillanos_autoeval.datos_marco'

  unillanos_autoeval.entidades_dependientes:
    class: Drupal\unillanos_autoeval\Service\EntidadesDependientes
    arguments: ['@entity_type.manager', '@entity_field.manager']
  Drupal\unillanos_autoeval\Service\EntidadesDependientes: '@unillanos_autoeval.entidades_dependientes'

  unillanos_autoeval.pertenencia_de_contenido:
    class: Drupal\unillanos_autoeval\Service\PertenenciaDeContenido
    arguments: ['@entity_type.manager', '@entity_type.bundle.info']
  Drupal\unillanos_autoeval\Service\PertenenciaDeContenido: '@unillanos_autoeval.pertenencia_de_contenido'

  logger.channel.unillanos_autoeval:
    parent: logger.channel_base
    arguments: ['unillanos_autoeval']

  unillanos_autoeval.enlaces_edicion:
    class: Drupal\unillanos_autoeval\Service\EnlacesEdicion
    arguments: ['@current_user', '@redirect.destination']
  Drupal\unillanos_autoeval\Service\EnlacesEdicion: '@unillanos_autoeval.enlaces_edicion'

  unillanos_autoeval.twig_extension:
    class: Drupal\unillanos_autoeval\Twig\UnillanosTwigExtension
    tags:
      - { name: twig.extension }

  # Páginas de «Institucional» (Fase 9, etapa 3).
  unillanos_autoeval.institucional_portada:
    class: Drupal\unillanos_autoeval\Service\InstitucionalPortada
    arguments: ['@config.factory', '@url_generator', '@unillanos_autoeval.enlaces_edicion']
  Drupal\unillanos_autoeval\Service\InstitucionalPortada: '@unillanos_autoeval.institucional_portada'

  unillanos_autoeval.institucional_procesos:
    class: Drupal\unillanos_autoeval\Service\InstitucionalProcesos
    arguments: ['@entity_type.manager', '@unillanos_autoeval.documentos_publicados', '@unillanos_autoeval.enlaces_edicion', '@unillanos_autoeval.factores_programa', '@unillanos_autoeval.plan_mejoramiento_programa']
  Drupal\unillanos_autoeval\Service\InstitucionalProcesos: '@unillanos_autoeval.institucional_procesos'

  unillanos_autoeval.institucional_dependencias:
    class: Drupal\unillanos_autoeval\Service\InstitucionalDependencias
    arguments: ['@entity_type.manager', '@unillanos_autoeval.documentos_publicados', '@unillanos_autoeval.enlaces_edicion']
  Drupal\unillanos_autoeval\Service\InstitucionalDependencias: '@unillanos_autoeval.institucional_dependencias'

  unillanos_autoeval.institucional_directivos:
    class: Drupal\unillanos_autoeval\Service\InstitucionalDirectivos
    arguments: ['@entity_type.manager', '@unillanos_autoeval.documentos_publicados', '@unillanos_autoeval.enlaces_edicion']
  Drupal\unillanos_autoeval\Service\InstitucionalDirectivos: '@unillanos_autoeval.institucional_directivos'

  unillanos_autoeval.institucional_normas:
    class: Drupal\unillanos_autoeval\Service\InstitucionalNormas
    arguments: ['@entity_type.manager', '@unillanos_autoeval.documentos_publicados', '@unillanos_autoeval.enlaces_edicion']
  Drupal\unillanos_autoeval\Service\InstitucionalNormas: '@unillanos_autoeval.institucional_normas'

  unillanos_autoeval.institucional_cifras:
    class: Drupal\unillanos_autoeval\Service\InstitucionalCifras
    arguments: ['@config.factory', '@unillanos_autoeval.enlaces_edicion']
  Drupal\unillanos_autoeval\Service\InstitucionalCifras: '@unillanos_autoeval.institucional_cifras'

  unillanos_autoeval.carrusel_portada:
    class: Drupal\unillanos_autoeval\Service\CarruselPortada
    arguments: ['@entity_type.manager', '@file_url_generator', '@current_user', '@unillanos_autoeval.enlaces_edicion']
  Drupal\unillanos_autoeval\Service\CarruselPortada: '@unillanos_autoeval.carrusel_portada'

  unillanos_autoeval.portal_inicio:
    class: Drupal\unillanos_autoeval\Service\PortalInicio
    arguments: ['@config.factory', '@unillanos_autoeval.enlaces_edicion']
  Drupal\unillanos_autoeval\Service\PortalInicio: '@unillanos_autoeval.portal_inicio'

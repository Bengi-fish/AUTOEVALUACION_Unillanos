services:
  unillanos_autoeval.calculador_grado:
    class: Drupal\unillanos_autoeval\Service\CalculadorGrado
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\CalculadorGrado: '@unillanos_autoeval.calculador_grado'

  unillanos_autoeval.avance_meta:
    class: Drupal\unillanos_autoeval\Service\AvanceMeta
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\AvanceMeta: '@unillanos_autoeval.avance_meta'

  unillanos_autoeval.sugerencia_destino:
    class: Drupal\unillanos_autoeval\Service\SugerenciaDestino
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\SugerenciaDestino: '@unillanos_autoeval.sugerencia_destino'

  unillanos_autoeval.modelo_proceso:
    class: Drupal\unillanos_autoeval\Service\ModeloProceso
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\ModeloProceso: '@unillanos_autoeval.modelo_proceso'

  unillanos_autoeval.listado_programas:
    class: Drupal\unillanos_autoeval\Service\ListadoProgramas
    arguments: ['@entity_type.manager']
  Drupal\unillanos_autoeval\Service\ListadoProgramas: '@unillanos_autoeval.listado_programas'

  unillanos_autoeval.presentador:
    class: Drupal\unillanos_autoeval\Service\PresentadorAutoevaluacion
    arguments: ['@entity_type.manager', '@path.validator', '@unillanos_autoeval.listado_programas']
  Drupal\unillanos_autoeval\Service\PresentadorAutoevaluacion: '@unillanos_autoeval.presentador'

  unillanos_autoeval.pagina_programa:
    class: Drupal\unillanos_autoeval\Service\PaginaPrograma
    arguments: ['@unillanos_autoeval.listado_programas', '@url_generator', '@access_manager', '@current_user']
  Drupal\unillanos_autoeval\Service\PaginaPrograma: '@unillanos_autoeval.pagina_programa'

  unillanos_autoeval.enlaces_del_pie:
    class: Drupal\unillanos_autoeval\Service\EnlacesDelPie
    arguments: ['@menu.link_tree']
  Drupal\unillanos_autoeval\Service\EnlacesDelPie: '@unillanos_autoeval.enlaces_del_pie'

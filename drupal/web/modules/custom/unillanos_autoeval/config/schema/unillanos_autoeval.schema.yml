unillanos_autoeval.micrositio:
  type: config_object
  label: 'Cabecera, franja superior y pie del micrositio'
  mapping:
    nombre_linea1:
      type: label
      label: 'Nombre del sistema, primera línea'
    nombre_linea2:
      type: label
      label: 'Nombre del sistema, segunda línea'
    url_web_principal:
      type: string
      label: 'URL de la web principal de la Universidad'
    url_govco:
      type: string
      label: 'URL del logo GOV.CO'
    redes_sociales:
      type: mapping
      label: 'Redes sociales de la Universidad (cabecera y pie)'
      mapping:
        facebook:
          type: string
          label: 'URL de Facebook'
        x:
          type: string
          label: 'URL de X'
        instagram:
          type: string
          label: 'URL de Instagram'
        youtube:
          type: string
          label: 'URL de YouTube'
    franja_superior:
      type: sequence
      label: 'Enlaces de la franja superior'
      sequence:
        type: unillanos_autoeval.enlace
    accesibilidad:
      type: unillanos_autoeval.enlace
      label: 'Enlace de accesibilidad'
    pie:
      type: mapping
      label: 'Pie de página'
      mapping:
        ubicanos:
          type: mapping
          label: 'Ubícanos'
          mapping:
            titulo:
              type: label
              label: 'Título del grupo'
            sedes:
              type: sequence
              label: 'Sedes con su dirección'
              sequence:
                type: unillanos_autoeval.enlace_texto
            horario:
              type: unillanos_autoeval.enlace_texto
              label: 'Horario de atención'
        contacto:
          type: unillanos_autoeval.grupo_contacto
          label: 'Contacto'
        lineas:
          type: unillanos_autoeval.grupo_contacto
          label: 'Líneas de atención'
        redes_titulo:
          type: label
          label: 'Título del grupo de redes'
        politicas:
          type: mapping
          label: 'Políticas'
          mapping:
            titulo:
              type: label
              label: 'Título del grupo'
            enlaces:
              type: sequence
              label: 'Enlaces'
              sequence:
                type: unillanos_autoeval.enlace
        logos:
          type: sequence
          label: 'Fila de logos'
          sequence:
            type: mapping
            mapping:
              clave:
                type: string
                label: 'Logo (unillanos, mineducacion, colombia o govco)'
              titulo:
                type: label
                label: 'Nombre accesible'
              url:
                type: string
                label: 'URL'
        derechos:
          type: mapping
          label: 'Línea final de derechos'
          mapping:
            institucion:
              type: label
              label: 'Institución'
            url:
              type: string
              label: 'URL de la institución'
            desde:
              type: integer
              label: 'Año de inicio'
            texto:
              type: label
              label: 'Texto de derechos'
            nit:
              type: label
              label: 'NIT'

unillanos_autoeval.grupo_contacto:
  type: mapping
  mapping:
    titulo:
      type: label
      label: 'Título del grupo'
    items:
      type: sequence
      label: 'Datos'
      sequence:
        type: mapping
        mapping:
          titulo:
            type: label
            label: 'Título'
          texto:
            type: label
            label: 'Valor'
          url:
            type: string
            label: 'URL'
          icono:
            type: string
            label: 'Ícono'

unillanos_autoeval.enlace_texto:
  type: mapping
  label: 'Título y texto'
  mapping:
    titulo:
      type: label
      label: 'Título'
    texto:
      type: label
      label: 'Texto'

unillanos_autoeval.enlace:
  type: mapping
  label: 'Enlace'
  mapping:
    titulo:
      type: label
      label: 'Título'
    url:
      type: string
      label: 'URL'

unillanos_autoeval.texto:
  type: mapping
  label: 'Texto'
  mapping:
    texto:
      type: label
      label: 'Texto'

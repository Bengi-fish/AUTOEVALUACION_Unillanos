$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Fases del proceso
status: stable
group: Contenido
description: 'Línea de fases numeradas. Una fase puede estar hecha (con ✓), actual (resaltada, aria-current="step") o pendiente.'
props:
  type: object
  required:
    - items
  properties:
    heading:
      type: string
      title: Nivel del título de cada fase
      enum:
        - ''
        - h2
        - h3
        - h4
      default: h3
    items:
      type: array
      title: Fases
      items:
        type: object
        required:
          - title
          - status
        properties:
          title:
            type: string
          text:
            type: string
          status:
            type: string
            enum:
              - hecho
              - actual
              - pendiente
          state_label:
            type: string
            description: 'Etiqueta visible del estado, por ejemplo «Completada» o «En curso». Si se omite, las fases hechas y actuales llevan un texto oculto equivalente.'

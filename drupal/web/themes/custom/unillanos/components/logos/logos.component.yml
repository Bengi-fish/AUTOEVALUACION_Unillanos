$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Logos
status: stable
group: Página base
description: 'Fila de los tres logos institucionales (Universidad de los Llanos, acreditación y «Volamos más alto»). Las imágenes salen de images/ en el tema.'
props:
  type: object
  properties:
    solo:
      type: string
      title: Solo un logo
      description: 'Si vale «unillanos» se imprime únicamente el logo de la Universidad (encabezado).'
      enum:
        - ''
        - unillanos
      default: ''
    large:
      type: boolean
      title: Grande
      description: 'Versión del pie de página (72 px de alto en lugar de 64 px).'
      default: false

$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Menú principal
status: stable
group: Página base
description: 'Menú principal con un nivel de submenú opcional (desplegable accesible: enlace a la sección y, a su lado, un botón con aria-expanded y aria-controls). Las URL deben venir de Drupal (menú o rutas), no de texto libre: solo se imprimen destinos relativos a la raíz, anclas, consultas, http(s), mailto y tel.'
props:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      title: Enlaces
      items:
        type: object
        required:
          - title
        properties:
          title:
            type: string
          url:
            type: string
          active:
            type: boolean
            description: 'La página actual: aria-current="page".'
          trail:
            type: boolean
            description: 'Una sección que contiene la página actual: aria-current="true" y la clase is-current.'
          children:
            type: array
            title: Submenú
            description: 'Hijos directos del elemento; con ellos el elemento lleva un botón que abre y cierra el submenú.'
            items:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                url:
                  type: string
                active:
                  type: boolean
    login:
      type: object
      title: Enlace «Ingresar» del menú móvil
      description: 'Último elemento del menú; solo se ve por debajo de 860 px con el menú abierto.'
      required:
        - title
        - url
      properties:
        title:
          type: string
        url:
          type: string
    id:
      type: string
      title: Identificador
      description: 'Lo usa el botón del encabezado en aria-controls. Por defecto ua-menu.'
    label:
      type: string
      title: Nombre accesible
      description: 'Por defecto «Menú principal».'
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once

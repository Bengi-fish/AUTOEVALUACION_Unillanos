$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Franja superior
status: stable
group: Página base
description: 'Franja oscura de 44 px sobre el encabezado: enlaces a la web principal y a servicios de la Universidad, y a la derecha el enlace de accesibilidad, los íconos de redes y el logo GOV.CO. Sin ninguno de ellos no imprime nada. Un destino que no es seguro se imprime sin href (mismo filtro que unillanos:button).'
props:
  type: object
  properties:
    links:
      type: array
      title: Enlaces
      items:
        type: object
        required:
          - title
        properties:
          title:
            type: string
          url:
            type: string
          externo:
            type: boolean
            description: 'Añade el ícono de enlace externo.'
    accessibility:
      type:
        - object
        - 'null'
      title: Enlace de accesibilidad
      description: 'Se imprime a la derecha; sin título o sin url no se imprime.'
      properties:
        title:
          type: string
        url:
          type: string
    social:
      type: array
      title: Redes sociales
      description: 'Íconos de redes a la derecha (ver unillanos:redes). Cada elemento con red, title y url; sin elementos no se imprimen.'
      items:
        type: object
        properties:
          red:
            type: string
          title:
            type: string
          url:
            type: string
    govco:
      type:
        - object
        - 'null'
      title: Logo GOV.CO
      description: 'Enlace del logo GOV.CO (versión para fondo oscuro del tema) a la derecha de las redes; sin title o sin url seguro no se imprime. `title` es su nombre accesible.'
      properties:
        title:
          type: string
        url:
          type: string
    label:
      type: string
      title: Nombre de la región para lectores de pantalla
      description: 'Por defecto «Enlaces de la Universidad».'

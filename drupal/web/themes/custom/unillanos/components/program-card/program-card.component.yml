$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Tarjeta de programa
status: stable
group: Contenido
description: 'Tarjeta de un programa en el listado (plantilla Pregrado), con seis líneas fijas: etiqueta «NIVEL · MODALIDAD», nombre, facultad, «duración · sede», píldora «Con autoevaluación» y llamada a la acción. Es un único enlace cuyo nombre accesible es el del programa; lo demás se lee como descripción. Lo vacío se omite, salvo la línea de duración y sede y la píldora, que dejan un hueco reservado (misma altura, sin texto, aria-hidden). Solo muestra los valores que recibe.'
props:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      title: Nombre del programa
    id:
      type: [string, integer]
      title: Identificador
      description: 'Único en la página. Con él el enlace se nombra por el programa (aria-labelledby) y se describe por la facultad y las etiquetas. Solo letras, números, guion y guion bajo; si no, se omite.'
    url:
      type: string
      title: Destino
      description: 'Sin url segura se imprime sin href, como el resto de enlaces del tema.'
    faculty:
      type: string
      title: Facultad
      description: 'Tal como está guardada («Facultad de …»); no se le añade prefijo.'
    faculty_key:
      type: string
      title: Clave de la facultad
      description: 'Sigla de la facultad en minúsculas (fcs, fce, fcbi, fcarn, fchye). Añade la clase ua-prog--{clave}; la tarjeta ya no se tiñe, la clase queda para la futura rejilla de facultades. Con caracteres no válidos no se añade.'
    level:
      type: string
      title: Nivel
    modality:
      type: string
      title: Modalidad
      description: 'Se une al nivel en la etiqueta («Pregrado · Presencial»); sin ella solo se imprime el nivel.'
    duration:
      type: [integer, string]
      title: Duración en semestres
      description: 'Entero positivo: se imprime «1 semestre» o «N semestres». Vacío o no válido se trata como ausente.'
    campus:
      type: string
      title: Sede
    evaluated:
      type: boolean
      title: Con autoevaluación
      description: 'Con true se imprime la píldora «Con autoevaluación»; con false queda un hueco reservado del mismo alto, sin texto.'
    heading:
      type: string
      title: Nivel del título del nombre
      enum:
        - ''
        - h2
        - h3
        - h4
      default: h3
    cta:
      type: string
      title: Llamada a la acción
      description: 'Por defecto «Ver programa».'

$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Encabezado
status: stable
group: Página base
description: 'Encabezado del sitio: enlace para saltar al contenido, franja superior opcional, logo con el nombre del sistema, el menú principal en el slot nav y las herramientas (búsqueda opcional, ingreso, botón del menú móvil).'
props:
  type: object
  properties:
    home_url:
      type: string
      title: Destino del logo
      description: 'Por defecto /.'
    kicker:
      type: string
      title: Rótulo superior
    name:
      type: string
      title: Nombre del sistema
    skip_target:
      type: string
      title: Destino del enlace «Saltar al contenido»
      description: 'Si se omite no se imprime el enlace.'
    topbar:
      type: object
      title: Franja superior
      description: 'Objeto con `links`, `accessibility`, `social` y `govco` (ver unillanos:topbar). Sin él no hay franja.'
    solo_logo:
      type: string
      title: Logo único
      description: 'Si vale «unillanos» solo se imprime el logo de la Universidad (ver unillanos:logos).'
    search_url:
      type: string
      title: Destino del buscador
      description: 'Con él, el buscador es un formulario GET con el campo q que lleva a esta URL.'
    show_search:
      type: boolean
      title: Mostrar buscador
      description: 'Sin search_url el campo no tiene acción asociada; activarlo solo cuando exista una búsqueda.'
      default: false
    login_url:
      type: string
      title: Destino de «Ingresar»
      description: 'Si se omite no se imprime el botón.'
    login_label:
      type: string
      title: Texto de «Ingresar»
    menu_toggle:
      type: boolean
      title: Botón del menú móvil
      description: 'Actívalo cuando el slot nav lleve el menú.'
      default: false
    menu_id:
      type: string
      title: Identificador del menú
      description: 'Debe coincidir con el id del componente nav. Por defecto ua-menu.'
slots:
  nav:
    title: Menú principal
    description: 'Componente nav.'
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once

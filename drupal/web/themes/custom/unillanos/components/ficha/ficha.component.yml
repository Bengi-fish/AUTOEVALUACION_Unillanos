$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Ficha
status: stable
group: Contenido
description: 'Ficha de datos en rejilla de cuatro columnas (dos en la variante compacta): término y valor. Úsala para datos de un programa o de una sede.'
props:
  type: object
  required:
    - items
  properties:
    variant:
      type: string
      title: Variante
      description: 'aside = aside de 360 px con título y filas término/valor (página del programa); vacío = rejilla.'
      enum:
        - ''
        - aside
    eyebrow:
      type: string
      title: Antetítulo
      description: 'Solo en el aside.'
    title:
      type: string
      title: Título
      description: 'Solo en el aside (h2).'
    compact:
      type: boolean
      title: Compacta
      description: 'Dos columnas y menos relleno (dentro de la tarjeta de sede).'
      default: false
    items:
      type: array
      title: Datos
      items:
        type: object
        required:
          - term
          - value
        properties:
          term:
            type: string
          value:
            type: string

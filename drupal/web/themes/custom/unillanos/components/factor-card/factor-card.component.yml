$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Tarjetas de factor
status: stable
group: Factores y plan
description: 'Cuadrícula de tarjetas de factor (o dimensión): imagen (marcador), número, nombre, medidor y llamada «Ver factor». Cada tarjeta es un enlace; sin url segura y con goto, el destino es #detalle; sin ninguno de los dos no es un enlace (div). goto es la clave de la pestaña a la que debe saltar (data-ua-goto) cuando exista el JS de pestañas. Solo muestra los valores y etiquetas que recibe.'
props:
  type: object
  required:
    - items
  properties:
    heading:
      type: string
      title: Nivel del título de cada tarjeta
      enum:
        - ''
        - h2
        - h3
        - h4
      default: h3
    image:
      type: string
      title: Imagen de la tarjeta
      description: 'tema: fondo propio con los colores del tema (placeholder variant tema) en lugar del recuadro gris de «Imagen del factor».'
      enum:
        - ''
        - tema
      default: ''
    items:
      type: array
      title: Tarjetas
      items:
        type: object
        required:
          - name
        properties:
          number:
            type: string
            description: 'Número que se muestra sobre la imagen, por ejemplo «01» o «D1».'
          name:
            type: string
          score:
            type: number
            description: 'Omite la clave si aún no hay valoración (se muestra «Sin valoración»).'
          grade:
            type: string
          decimals:
            type: integer
            minimum: 0
            maximum: 3
          url:
            type: string
          goto:
            type: string
            pattern: '^[a-z0-9_-]+$'
          goto_tabs:
            type: string
            pattern: '^[a-z][a-z0-9_-]*$'
            description: 'Id del conjunto de pestañas de destino; solo hace falta si hay varios en la página.'
          cta:
            type: string
            description: 'Texto de la llamada. Por defecto «Ver factor».'

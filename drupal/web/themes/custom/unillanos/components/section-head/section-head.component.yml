$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Encabezado de sección
status: stable
group: Base
description: 'Antetítulo, título y bajada de una sección, con un espacio a la derecha para acciones. La variante «panel» es la introducción de un panel de pestañas.'
props:
  type: object
  required:
    - title
  properties:
    eyebrow:
      type: string
      title: Antetítulo
    title:
      type: string
      title: Título
    lead:
      type: string
      title: Bajada
    variant:
      type: string
      title: Variante
      enum:
        - ''
        - section
        - panel
      default: section
    heading:
      type: string
      title: Nivel del título
      enum:
        - ''
        - h2
        - h3
        - h4
      default: h2
slots:
  right:
    title: Derecha
    description: 'Acciones o selectores alineados a la derecha.'

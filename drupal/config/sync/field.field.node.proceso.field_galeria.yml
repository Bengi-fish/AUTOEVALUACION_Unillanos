label: 'Galería de imágenes'
description: 'Imágenes del carrusel de esta página (hasta 10). Se ordenan arrastrando. JPG, PNG o WebP de hasta 5 MB y al menos 1280 píxeles de ancho; se muestran con proporción 16:6 (se recorta al centro). Escriba siempre el texto alternativo; la leyenda es opcional. Sin imágenes, no se muestra el carrusel. Solo se usa en el proceso institucional (el que no tiene programa): sus imágenes forman el carrusel de la página «Institucional». En los procesos de un programa no se usa; las del programa van en la ficha del programa.'
